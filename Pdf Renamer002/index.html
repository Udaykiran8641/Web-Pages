<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PDF Bulk Renamer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>📄 Bulk PDF Renamer</h2>
    <p>1️⃣ Upload your PDF files</p>
    <input type="file" id="pdfFiles" accept="application/pdf" multiple>
    <p>2️⃣ Upload your list of names (.txt or .csv)</p>
    <input type="file" id="nameList" accept=".txt,.csv">
    <button onclick="renameAndDownload()">🔄 Rename & Download</button>
    <p id="status"></p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
